# Blueprint de Render: New > Blueprint > conecta tu repo de GitHub.
services:
  - type: web
    name: crm-whatsapp
    runtime: python
    plan: free
    region: oregon
    buildCommand: pip install -r requirements.txt
    # 1 worker para que solo haya un programador de seguimientos; los hilos atienden en paralelo
    startCommand: gunicorn app:app --workers 1 --threads 8 --timeout 120
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.9
      - key: SECRET_KEY
        generateValue: true
      - key: CRON_TOKEN
        generateValue: true
      - key: ADMIN_PASSWORD
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: WA_MODE
        value: cloud
      - key: WA_TOKEN
        sync: false
      - key: WA_PHONE_NUMBER_ID
        sync: false
      - key: WA_VERIFY_TOKEN
        sync: false
      - key: WA_APP_SECRET
        sync: false
      - key: WA_API_VERSION
        value: v23.0
      - key: PUBLIC_BASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: BUSINESS_NAME
        value: Filtra tu Placa
